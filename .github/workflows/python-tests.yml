name: Run Pytest

on:
  push:
    branches:
      - task1
      - task2
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: logq
          auto-update-conda: true
      
      - name: Install logq package
        shell: bash -l {0}
        run: |
          python -m pip install -e .

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest --maxfail=1 --disable-warnings -q
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TorchServe tools
        run: |
          pip install torch torchserve torch-model-archiver

      - name: Prepare files and directories for Docker build
        run: |
          # Placeholders
          mkdir -p models
          touch models/sasrec-best.pt
          touch models/inbatch-best.pt
          touch models/inbatch-logq-old-best.pt
          touch models/inbatch-logq-new-best.pt

          mkdir -p ml1m
          touch ml1m/dataset_stats.json
          touch ml1m/item_cnt.pkl

          mkdir -p torchserve/model-store

          torch-model-archiver \
            --model-name archive \
            --version 1.0 \
            --serialized-file models/sasrec-best.pt \
            --handler torchserve/handler.py \
            --extra-files "logq/configs/ml1m_sasrec.py,logq/configs/ml1m_other.py,ml1m/dataset_stats.json,ml1m/item_cnt.pkl,models/inbatch-best.pt,models/inbatch-logq-old-best.pt,models/inbatch-logq-new-best.pt" \
            --export-path torchserve/model-store \
            --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ml-app:v1 .

      - name: Build TorchServe Docker image
        run: |
          docker build -f torchserve/Dockerfile -t mymodel-serve:v1 .