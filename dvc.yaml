stages:
  prepare:
    cmd: python src/preprocess_ml1m.py
    deps:
    - ml1m/ml-1m.txt
    - src/preprocess_ml1m.py
    outs:
    - ml1m/dataset_stats.json
    - ml1m/test
    - ml1m/train
    - ml1m/val
  train_sasrec:
    cmd: python src/train_sasrec.py --device=6 
      --config=logq/configs/ml1m_sasrec.py
    deps:
    - logq/configs/ml1m_sasrec.py
    - ml1m/train
    - ml1m/val
    - src/train_sasrec.py
    outs:
    - models/sasrec-ml1m-step:2496-emb:128-dropout:0.5-metric:0.1424491927360601.pt
  train_inbatch:
    cmd: python src/train_in_batch.py --device=6 
      --config=logq/configs/ml1m_other.py
    deps:
    - logq/configs/ml1m_other.py
    - ml1m/train
    - ml1m/val
    - src/train_in_batch.py
    outs:
    - models/inbatch-ml1m-step:2160-negs:256-emb:128-dropout:0.5-metric:0.17746228301182293.pt
  train_inbatch_logq_old:
    cmd: python src/train_in_batch_logq_old.py --device=6 
      --config=logq/configs/ml1m_other.py
    deps:
    - logq/configs/ml1m_other.py
    - ml1m/train
    - ml1m/val
    - src/train_in_batch_logq_old.py
    outs:
    - models/inbatch-logq-old-ml1m-step:11424-negs:256-emb:128-dropout:0.5-metric:0.18484549090367997.pt
  train_inbatch_logq_new:
    cmd: python src/train_in_batch_logq_new.py --device=6 
      --config=logq/configs/ml1m_other.py
    deps:
    - logq/configs/ml1m_other.py
    - ml1m/train
    - ml1m/val
    - src/train_in_batch_logq_new.py
    outs:
    - models/inbatch-logq-new-ml1m-step:17184-negs:256-emb:128-dropout:0.5-metric:0.19111822481363075.pt
